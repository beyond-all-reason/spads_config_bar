# Access rights of the plugin commands (located in SPADS etc directory, same syntax as commands.conf)
commandsFile:GameVersionCmd.conf

# Help of the plugin commands (located in SPADS plugins directory, same syntax as help.dat)
helpFile:GameVersionHelp.dat

# Rapid tags the !gameVersion command is allowed to switch to (anchored regular expression).
# This is a global plugin setting, so the value is taken verbatim: '|' is not a list separator here.
allowedRapidTags:^byar:(test|pr-[0-9]+|br-.+)$

# pr-downloader binary, and the directory it downloads into (the engine data directory)
prDownloaderPath:%CMD_enginesBaseDir%%CMD_engineDir%pr-downloader
prDownloaderWritePath:%CMD_springDataDir%

# Environment of the pr-downloader process, semicolon separated NAME=VALUE pairs.
# Keep in sync with pr-downloader.service, which runs the periodic download with the same settings.
prDownloaderEnv:PRD_RAPID_USE_STREAMER=false;PRD_RAPID_REPO_MASTER=https://repos-cdn.beyondallreason.dev/repos.gz

# Seconds allowed for waiting on the SPADS unitsync lock plus the download itself
timeout:600
